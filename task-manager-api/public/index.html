<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <meta name="description" content="A modern, premium task manager application with dark theme.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <div class="app-container">
        <header class="header">
            <h1>Task <span>Manager</span></h1>
        </header>

        <main>
            <section class="task-form-section">
                <form id="task-form" class="task-form">
                    <input type="hidden" id="task-id">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" placeholder="What needs to be done?" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" placeholder="Add some details..." rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <select id="priority">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <button type="submit" id="submit-btn" class="btn-primary">Add Task</button>
                    <button type="button" id="cancel-edit-btn" class="btn-secondary hidden">Cancel Edit</button>
                </form>
            </section>

            <section class="task-controls">
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                <div class="task-summary">
                    <span id="task-count">0 tasks</span>
                </div>
            </section>

            <section class="task-list-section">
                <div id="loading" class="loading hidden">Loading tasks...</div>
                <div id="empty-state" class="empty-state hidden">
                    <p>No tasks found. Create one above!</p>
                </div>
                <div id="task-list" class="task-grid"></div>
            </section>
        </main>
    </div>

    <script>
        const API_URL = '/api/tasks';
        let tasks = [];
        let currentFilter = 'all';
        let isEditing = false;

        const form = document.getElementById('task-form');
        const titleInput = document.getElementById('title');
        const descInput = document.getElementById('description');
        const priorityInput = document.getElementById('priority');
        const idInput = document.getElementById('task-id');
        const submitBtn = document.getElementById('submit-btn');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const taskList = document.getElementById('task-list');
        const loadingEl = document.getElementById('loading');
        const emptyStateEl = document.getElementById('empty-state');
        const taskCountEl = document.getElementById('task-count');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const toastContainer = document.getElementById('toast-container');

        // Initialize
        fetchTasks();

        // Event Listeners
        form.addEventListener('submit', handleFormSubmit);
        cancelEditBtn.addEventListener('click', resetForm);
        
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                renderTasks();
            });
        });

        async function fetchTasks() {
            showLoading(true);
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('Failed to fetch tasks');
                const json = await res.json();
                tasks = json.data;
                renderTasks();
            } catch (err) {
                showToast('Error loading tasks', 'error');
                console.error(err);
            } finally {
                showLoading(false);
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const taskData = {
                title: titleInput.value.trim(),
                description: descInput.value.trim(),
                priority: priorityInput.value
            };

            if (!taskData.title) return;

            try {
                if (isEditing) {
                    const id = idInput.value;
                    const res = await fetch(`${API_URL}/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(taskData)
                    });
                    if (!res.ok) throw new Error('Failed to update task');
                    const json = await res.json();
                    const updatedTask = json.data;
                    tasks = tasks.map(t => t.id === id || t._id === id ? updatedTask : t);
                    showToast('Task updated successfully', 'success');
                } else {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(taskData)
                    });
                    if (!res.ok) throw new Error('Failed to create task');
                    const json = await res.json();
                    const newTask = json.data;
                    tasks.push(newTask);
                    showToast('Task added successfully', 'success');
                }
                resetForm();
                renderTasks();
            } catch (err) {
                showToast(isEditing ? 'Error updating task' : 'Error creating task', 'error');
                console.error(err);
            }
        }

        async function deleteTask(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;
            
            try {
                const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Failed to delete task');
                tasks = tasks.filter(t => t.id !== id && t._id !== id);
                renderTasks();
                showToast('Task deleted', 'success');
            } catch (err) {
                showToast('Error deleting task', 'error');
                console.error(err);
            }
        }

        async function toggleComplete(id, currentStatus) {
            try {
                const res = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ completed: !currentStatus })
                });
                if (!res.ok) throw new Error('Failed to update task');
                const json = await res.json();
                const updatedTask = json.data;
                tasks = tasks.map(t => t.id === id || t._id === id ? updatedTask : t);
                renderTasks();
            } catch (err) {
                showToast('Error updating status', 'error');
                console.error(err);
            }
        }

        function editTask(id) {
            const task = tasks.find(t => t.id === id || t._id === id);
            if (!task) return;
            
            titleInput.value = task.title;
            descInput.value = task.description || '';
            priorityInput.value = task.priority || 'Medium';
            idInput.value = task.id || task._id;
            
            isEditing = true;
            submitBtn.textContent = 'Update Task';
            cancelEditBtn.classList.remove('hidden');
            
            // Scroll to form
            form.scrollIntoView({ behavior: 'smooth' });
        }

        function resetForm() {
            form.reset();
            isEditing = false;
            idInput.value = '';
            submitBtn.textContent = 'Add Task';
            cancelEditBtn.classList.add('hidden');
        }

        function renderTasks() {
            const filteredTasks = tasks.filter(t => {
                if (currentFilter === 'active') return !t.completed;
                if (currentFilter === 'completed') return t.completed;
                return true;
            });

            taskCountEl.textContent = `${filteredTasks.length} task${filteredTasks.length !== 1 ? 's' : ''}`;

            if (filteredTasks.length === 0) {
                taskList.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }

            emptyStateEl.classList.add('hidden');
            
            taskList.innerHTML = filteredTasks.map(task => {
                const id = task.id || task._id;
                const createdDate = task.createdAt ? new Date(task.createdAt).toLocaleDateString() : new Date().toLocaleDateString();
                const priorityClass = `badge-${(task.priority || 'Medium').toLowerCase()}`;
                
                return `
                    <div class="task-card ${task.completed ? 'completed' : ''} fade-in">
                        <div class="task-header">
                            <span class="badge ${priorityClass}">${task.priority ? task.priority.charAt(0).toUpperCase() + task.priority.slice(1) : 'Medium'}</span>
                            <span class="date">${createdDate}</span>
                        </div>
                        <h3 class="task-title ${task.completed ? 'strikethrough' : ''}">${escapeHtml(task.title)}</h3>
                        <p class="task-desc">${escapeHtml(task.description || '')}</p>
                        <div class="task-actions">
                            <button class="btn-toggle ${task.completed ? 'btn-toggle-active' : ''}" onclick="toggleComplete('${id}', ${task.completed})">
                                ${task.completed ? '✓ Completed' : '○ Complete'}
                            </button>
                            <div class="action-buttons">
                                <button class="btn-edit" onclick="editTask('${id}')">Edit</button>
                                <button class="btn-delete" onclick="deleteTask('${id}')">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showLoading(show) {
            if (show) {
                loadingEl.classList.remove('hidden');
                taskList.innerHTML = '';
                emptyStateEl.classList.add('hidden');
            } else {
                loadingEl.classList.add('hidden');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type} slide-in`;
            toast.textContent = message;
            
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('slide-in');
                toast.classList.add('slide-out');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
